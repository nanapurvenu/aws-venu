AWSTemplateFormatVersion: 2010-09-09
Description: lms application
# Resources section
Resources:
#lms VPC
  lmsVPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
       - Key: Name
         Value: lmsvpc
#lmswebsubnet
  lmswebSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref lmsVPC
      CidrBlock: 10.0.0.0/20
      AvailabilityZone: us-west-2a
      Tags:
       - Key: Name
         Value: websubnet         
#lmsappsubnet
  lmsappSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref lmsVPC
      CidrBlock: 10.0.16.0/20
      AvailabilityZone: us-west-2a
      Tags:
       - Key: Name
         Value: appsubnet 
#lmsdbsubnet
  lmsdbSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref lmsVPC
      CidrBlock: 10.0.32.0/20
      AvailabilityZone: us-west-2a
      Tags:
       - Key: Name
         Value: dbsubnet    
#lmsinternetgateway
  lmsInternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
       - Key: Name
         Value: InternetGateway    
#lms AttachInternetGateway                   
  lmsAttachGateway:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId:
        Ref: lmsVPC
      InternetGatewayId:
        Ref: lmsInternetGateway
#lmspublicrouttable 
  lmspublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId:  
        Ref: lmsVPC
      Tags:
       - Key: Name
         Value: public RT  
#lmsappSubnetRouteTableAssociation
  lmsappSubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId:
        Ref: lmsappSubnet
      RouteTableId:
        Ref: lmspublicRouteTable
#lmswebSubnetRouteTableAssociation
  lmswebSubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId:
        Ref: lmswebSubnet
      RouteTableId:
        Ref: lmspublicRouteTable 
#lmsCarrierRoute
  lmsCarrierRoute:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId:
        Ref: lmspublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId:
        Ref: lmsInternetGateway 
#lmsprivaterouttable 
  lmsprivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId:  
        Ref: lmsVPC
      Tags:
       - Key: Name
         Value: private RT   
#lmsdbSubnetRouteTableAssociation
  lmsdbSubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId:
        Ref: lmsdbSubnet
      RouteTableId:
        Ref: lmsprivateRouteTable
#lmsNetworkAcl          
  lmsNetworkAcl:
    Type: AWS::EC2::NetworkAcl
    Properties:
      VpcId:
        Ref: lmsVPC
      Tags:
       - Key: Name
         Value: lmsNetworkAcl 
#NACL rules         
  lmsInboundRule:
    Type: AWS::EC2::NetworkAclEntry
    Properties:
      NetworkAclId:
        Ref: lmsNetworkAcl
      RuleNumber: 100
      Protocol: 6
      RuleAction: allow
      CidrBlock: 0.0.0.0/0
      PortRange:
        From: 22
        To: 65535
  lmsOutboundRule:
    Type: AWS::EC2::NetworkAclEntry
    Properties:
      NetworkAclId:
        Ref: lmsNetworkAcl
      RuleNumber: 100
      Protocol: -1
      Egress: true
      RuleAction: allow
      CidrBlock: 0.0.0.0/0
#lmswebSubnetNetworkAclAssociation    
  lmswebSubnetNetworkAclAssociation:
    Type: AWS::EC2::SubnetNetworkAclAssociation
    Properties:
      SubnetId:
        Ref: lmswebSubnet
      NetworkAclId:
        Ref: lmsNetworkAcl 
#lmsappSubnetNetworkAclAssociation    
  lmsappSubnetNetworkAclAssociation:
    Type: AWS::EC2::SubnetNetworkAclAssociation
    Properties:
      SubnetId:
        Ref: lmsappSubnet
      NetworkAclId:
        Ref: lmsNetworkAcl      
#lmsdbSubnetNetworkAclAssociation    
  lmsdbSubnetNetworkAclAssociation:
    Type: AWS::EC2::SubnetNetworkAclAssociation
    Properties:
      SubnetId:
        Ref: lmsdbSubnet
      NetworkAclId:
        Ref: lmsNetworkAcl
#lmswebInstanceSecurityGroup        
  lmswebInstanceSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow ssh & http to client host
      VpcId: !Ref lmsVPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: 0.0.0.0/0   
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 0
          ToPort: 65535
          CidrIp: 0.0.0.0/0           
      Tags:
        - Key: Name
          Value: web-SG 
#lmsappInstanceSecurityGroup        
  lmsappInstanceSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow ssh & http to client host
      VpcId: !Ref lmsVPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 8080
          ToPort: 8080
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: 0.0.0.0/0   
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 0
          ToPort: 65535
          CidrIp: 0.0.0.0/0           
      Tags:
        - Key: Name
          Value: app-SG 
